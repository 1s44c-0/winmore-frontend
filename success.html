<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Win More on Bets</title>
    <style>
        /* ============================================
           ROOT VARIABLES
           ============================================ */

        :root {
            --bg-primary: #fafaf8;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a18;
            --text-secondary: #666662;
            --accent-blue: #00C3F7;
            --accent-dark-blue: #036884;
            --border-light: rgba(0, 0, 0, 0.06);
            --shadow-subtle: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        main {
            width: 100%;
            max-width: 520px;
        }

        /* ============================================
           SUCCESS CARD
           ============================================ */

        .success-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 48px 32px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        /* ============================================
           SUCCESS ICON
           ============================================ */

        .success-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            margin: 0 auto 32px;
            background-color: var(--accent-blue);
            border-radius: 50%;
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-icon svg {
            width: 48px;
            height: 48px;
        }

        /* ============================================
           HEADING
           ============================================ */

        .success-card h1 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
            color: var(--text-primary);
            line-height: 1.2;
        }

        /* ============================================
           DESCRIPTION
           ============================================ */

        .success-card p:first-of-type {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .success-card p:first-of-type strong {
            color: var(--text-primary);
            font-weight: 700;
        }

        /* ============================================
           STATUS MESSAGE
           ============================================ */

        #status {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 28px;
            min-height: 20px;
            display: block;
        }

        /* ============================================
           DOWNLOAD BUTTON
           ============================================ */

        #downloadButton {
            width: 100%;
            padding: 16px 24px;
            background-color: var(--accent-blue);
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 32px;
            display: none;
        }

        #downloadButton:hover:not(:disabled) {
            background-color: var(--accent-dark-blue);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 195, 247, 0.2);
        }

        #downloadButton:active:not(:disabled) {
            transform: translateY(0);
        }

        #downloadButton:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* ============================================
           BRANDING
           ============================================ */

        .branding {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            text-transform: uppercase;
            opacity: 0.6;
        }

        /* ============================================
           RESPONSIVE DESIGN
           ============================================ */

        @media (max-width: 480px) {
            .success-card {
                padding: 36px 24px;
            }

            .success-card h1 {
                font-size: 26px;
                margin-bottom: 12px;
            }

            .success-card p:first-of-type {
                font-size: 15px;
                margin-bottom: 24px;
            }

            .success-icon {
                width: 72px;
                height: 72px;
                margin-bottom: 24px;
            }

            .success-icon svg {
                width: 40px;
                height: 40px;
            }

            #status {
                font-size: 13px;
                margin-bottom: 24px;
            }

            #downloadButton {
                padding: 14px 20px;
                font-size: 14px;
                margin-bottom: 24px;
            }

            .branding {
                font-size: 11px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .success-icon {
                animation: none;
            }

            * {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="success-card">
            <!-- Success Icon -->
            <div class="success-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>

            <!-- Heading -->
            <h1>Payment Successful!</h1>

            <!-- Description -->
            <p>
                Thank you for purchasing <strong>Win More on Bets</strong>.
            </p>

            <!-- Status Message (JavaScript Updated) -->
            <p id="status">Verifying your payment...</p>

            <!-- Download Button (JavaScript Controlled) -->
            <button id="downloadButton" style="color: white;">
                Download Your Book
            </button>

            <!-- Branding -->
            <div class="branding">WIN MORE ON BETS</div>
        </div>
    </main>
    <script>
        const API_URL = "https://winmore-backend.onrender.com";

        const statusText =
            document.getElementById("status");

        const downloadButton =
            document.getElementById("downloadButton");

        const params =
            new URLSearchParams(window.location.search);

        const reference =
            params.get("reference");

        let downloadUrl = null;


        // Verify payment
        async function verifyPayment() {

            if (!reference) {
                statusText.textContent =
                    "Payment reference is missing.";
                return;
            }

            try {

                const response = await fetch(
                    `${API_URL}/api/payment/status/${reference}/`
                );

                const data = await response.json();

                if (!response.ok || !data.status) {

                    statusText.textContent =
                        data.message ||
                        "Payment could not be verified.";

                    return;
                }

                if (data.payment_status === "paid") {

                    statusText.textContent =
                        "Your payment has been confirmed.";

                    downloadUrl =
                        data.download_url;

                    downloadButton.style.display =
                        "inline-block";

                } else {

                    statusText.textContent =
                        "Your payment is still being processed.";

                }

            } catch (error) {

                console.error(error);

                statusText.textContent =
                    "Unable to verify payment. Please try again.";

            }
        }


        // Download book
        downloadButton.addEventListener(
            "click",
            async function () {

                if (!downloadUrl) {
                    return;
                }

                downloadButton.disabled = true;

                downloadButton.textContent =
                    "Preparing download...";

                try {

                    const response =
                        await fetch(downloadUrl);

                    if (!response.ok) {

                        let errorMessage =
                            "Download unavailable.";

                        try {

                            const data =
                                await response.json();

                            errorMessage =
                                data.message ||
                                errorMessage;

                        } catch (error) {
                            // Response was not JSON
                        }

                        throw new Error(errorMessage);
                    }

                    const blob =
                        await response.blob();

                    const url =
                        window.URL.createObjectURL(blob);

                    const link =
                        document.createElement("a");

                    link.href = url;

                    link.download =
                        "Win-More-on-Bets.pdf";

                    document.body.appendChild(link);

                    link.click();

                    link.remove();

                    window.URL.revokeObjectURL(url);

                    downloadButton.textContent =
                        "Download Completed";

                } catch (error) {

                    console.error(error);

                    alert(error.message);

                    downloadButton.disabled =
                        false;

                    downloadButton.textContent =
                        "Download Your Book";
                }

            }
        );


        verifyPayment();
    </script>
</body>
</html>
